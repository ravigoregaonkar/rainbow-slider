<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #halfRoundSlider {
        border-radius: 50%;
      }
      .rs-control .rs-range-color {
        fill: url(#rainbowGradient);
        border-radius: 50%;
      }

    </style>
  </head>

  <body>
    <svg width="0" height="0">
      <defs>
        <radialGradient id="rainbowHalfRadial" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f00" />
            <stop offset="16.6%" stop-color="#f70" />
            <stop offset="33.3%" stop-color="#ff0" />
            <stop offset="50%" stop-color="#0f0" />
            <stop offset="66.6%" stop-color="#0ff" />
            <stop offset="83.3%" stop-color="#00f" />
            <stop offset="100%" stop-color="#f0f" />
          </radialGradient>
          
          
      </defs>
    </svg>

    <div id="halfRoundSlider"></div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

    <!-- roundSlider CSS and JS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/roundSlider/1.6.1/roundslider.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/roundSlider/1.6.1/roundslider.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#halfRoundSlider").roundSlider({
          sliderType: "min-range",
          circleShape: "full",
          value: 100,
          min: 0,
          max: 100,
          radius: 150,
          width: 60,
          handleSize: "+1",
          showTooltip: true,
          rangeColor: "url(#rainbowHalfRadial)",
          svgMode: true,
          endAngle: "180",
        });
      });
    </script>
  </body>
</html>
